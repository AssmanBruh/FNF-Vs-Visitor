<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FNF Chart Generator & ScrollSpeed Adjuster</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

  <div class="glass max-w-2xl w-full rounded-2xl p-8 shadow-2xl space-y-6">
    
    <div class="text-center space-y-2">
      <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">
        FNF Difficulty & ScrollSpeed Auto-Generator
      </h1>
      <p class="text-slate-400 text-sm">Genera notas y escala el Scroll Speed para Easy/Normal sin tocar las originales</p>
    </div>

    <!-- Carga de Archivos -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="border-2 border-dashed border-slate-700 hover:border-purple-500 transition rounded-xl p-4 text-center cursor-pointer relative">
        <input type="file" id="chartInput" accept=".json" class="absolute inset-0 opacity-0 cursor-pointer">
        <i class="fa-solid fa-file-code text-2xl text-purple-400 mb-2"></i>
        <p class="text-xs font-semibold text-slate-300">Cargar Chart (.json)</p>
        <span id="chartName" class="text-[10px] text-slate-500 block truncate">Sin archivo</span>
      </div>

      <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700/50 flex flex-col justify-center">
        <label class="text-xs font-semibold text-slate-300 mb-1 flex items-center gap-1">
          <i class="fa-solid fa-gauge-high text-purple-400"></i> BPM Base:
        </label>
        <input type="number" id="bpmInput" value="130" min="40" max="300" step="0.1" 
               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-center text-purple-300 font-bold focus:outline-none focus:border-purple-500">
      </div>
    </div>

    <!-- Botón de Acción -->
    <button id="convertBtn" class="w-full py-3 bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-bold rounded-xl shadow-lg transition transform active:scale-95">
      Generar Dificultades y ScrollSpeed
    </button>

    <!-- Previsualización -->
    <div class="space-y-2">
      <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Resultado (JSON Final):</label>
      <textarea id="output" readonly rows="10" 
                class="w-full bg-slate-950/80 border border-slate-800 rounded-xl p-3 font-mono text-xs text-emerald-400 focus:outline-none resize-none"
                placeholder="El JSON con las dificultades y scrollSpeeds auto-generados aparecerá aquí..."></textarea>
    </div>

  </div>

  <script>
    const chartInput = document.getElementById('chartInput');
    const bpmInput = document.getElementById('bpmInput');
    const output = document.getElementById('output');
    let loadedChartData = null;

    chartInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('chartName').innerText = file.name;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          loadedChartData = JSON.parse(event.target.result);
          
          if (loadedChartData.events && loadedChartData.events.length > 1) {
            const firstEventTime = loadedChartData.events[1].t;
            if (firstEventTime > 0) {
              const estimatedBpm = Math.round((60000 / (firstEventTime / 4)) * 100) / 100;
              bpmInput.value = estimatedBpm;
            }
          }
        } catch (err) {
          alert("Error al leer el archivo JSON.");
        }
      };
      reader.readAsText(file);
    });

    function downscaleNotes(notesArray, ratio) {
      if (!notesArray || !Array.isArray(notesArray)) return [];
      return notesArray.filter((note, index) => {
        if (index % Math.round(1 / ratio) === 0) return true;
        if (note.l && note.l > 0) return true; 
        return false;
      });
    }

    document.getElementById('convertBtn').addEventListener('click', () => {
      if (!loadedChartData) {
        alert("Por favor carga primero el archivo JSON del chart.");
        return;
      }

      const finalChart = JSON.parse(JSON.stringify(loadedChartData));
      
      if (!finalChart.notes) finalChart.notes = {};
      if (!finalChart.scrollSpeed) finalChart.scrollSpeed = {};

      const notesKeys = Object.keys(finalChart.notes);

      // Buscar cuál es la dificultad original de mayor jerarquía
      let baseKey = null;
      if (finalChart.notes['nightmare']) baseKey = 'nightmare';
      else if (finalChart.notes['hard']) baseKey = 'hard';
      else if (notesKeys.length > 0) baseKey = notesKeys[0];

      if (!baseKey) {
        alert("No se encontraron notas en el chart.");
        return;
      }

      const baseNotes = finalChart.notes[baseKey];
      
      // Obtener el scrollSpeed base original (o 2.0 por defecto si no venía especificado)
      let baseSpeed = 2.0;
      if (typeof finalChart.scrollSpeed === 'number') {
        baseSpeed = finalChart.scrollSpeed;
        finalChart.scrollSpeed = { [baseKey]: baseSpeed };
      } else if (finalChart.scrollSpeed[baseKey]) {
        baseSpeed = finalChart.scrollSpeed[baseKey];
      }

      // 1. ERECT (Si la base es Nightmare)
      if (baseKey === 'nightmare' && !finalChart.notes['erect']) {
        finalChart.notes['erect'] = JSON.parse(JSON.stringify(baseNotes));
        if (!finalChart.scrollSpeed['erect']) {
          finalChart.scrollSpeed['erect'] = baseSpeed;
        }
      }

      // 2. NORMAL (Si no existe, se escala notas + Scroll Speed a ~85% del base)
      if (!finalChart.notes['normal']) {
        finalChart.notes['normal'] = downscaleNotes(baseNotes, 0.75);
      }
      if (!finalChart.scrollSpeed['normal']) {
        finalChart.scrollSpeed['normal'] = Math.round((baseSpeed * 0.85) * 10) / 10;
      }

      // 3. EASY (Si no existe, se escala notas + Scroll Speed a ~70% del base)
      if (!finalChart.notes['easy']) {
        finalChart.notes['easy'] = downscaleNotes(baseNotes, 0.45);
      }
      if (!finalChart.scrollSpeed['easy']) {
        finalChart.scrollSpeed['easy'] = Math.round((baseSpeed * 0.70) * 10) / 10;
      }

      // Conversión de Eventos a Step Time
      const bpm = parseFloat(bpmInput.value);
      const msPerBeat = 60000 / bpm;
      const msPerStep = msPerBeat / 4;

      if (finalChart.events) {
        finalChart.events = finalChart.events.map(evt => {
          if (evt.t !== undefined && evt.step === undefined) {
            return {
              step: Math.round((evt.t / msPerStep) * 100) / 100,
              e: evt.e,
              v: evt.v
            };
          }
          return evt;
        });
      }

      finalChart.bpm = bpm;

      output.value = JSON.stringify(finalChart, null, 2);
    });
  </script>
</body>
</html>
